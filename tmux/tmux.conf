# Интерфейс tmux, близкий к GNU Screen.
# Главный префикс: Ctrl-a. Все команды ниже нажимаются после Ctrl-a.

unbind-key C-b
set-option -g prefix C-a

# Как в screen: Ctrl-a Ctrl-a — предыдущее окно, Ctrl-a a — передать Ctrl-a
# приложению внутри pane.
bind-key C-a last-window
bind-key a send-prefix

# Окна screen: c/new, n/next, p/previous, "/list, A/title, d/detach.
bind-key c new-window -c '#{pane_current_path}'
bind-key -r n next-window
bind-key -r p previous-window
bind-key '"' choose-tree -Zw
bind-key w choose-tree -Zw
bind-key A command-prompt -I '#W' "rename-window '%%'"
bind-key d detach-client
bind-key k confirm-before -p 'Закрыть окно #W? (y/n)' kill-window
bind-key \\ confirm-before -p 'Завершить весь tmux? (y/n)' kill-server

# Разбиение похоже на screen: S — верх/низ, | — слева/справа, Tab — следующий pane.
bind-key S split-window -v -c '#{pane_current_path}'
bind-key '|' split-window -h -c '#{pane_current_path}'
bind-key Tab select-pane -t ':.'+
bind-key X confirm-before -p 'Закрыть pane? (y/n)' kill-pane
bind-key Q confirm-before -p 'Закрыть остальные panes? (y/n)' 'kill-pane -a'
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D

# Copy/scroll: Ctrl-a [, затем Space — начало, Enter — копировать и выйти.
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -T copy-mode Space send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-g send-keys -X cancel

# Полезно для invi: Ctrl-a y включает/выключает ввод во все panes окна.
bind-key y set-window-option synchronize-panes \; display-message 'sync #{?pane_synchronized,on,off}'

# Mouse по умолчанию выключен, как в screen. Ctrl-a m переключает его.
set-option -g mouse off
bind-key m set-option -g mouse \; display-message 'mouse #{?mouse,on,off}'

# Служебные команды: : — tmux prompt, ? — все bindings, r — перечитать конфиг.
bind-key : command-prompt
bind-key ? list-keys
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Поведение терминала и история.
set-option -g default-terminal 'screen-256color'
set-option -as terminal-features ',xterm*:RGB'
set-option -g history-limit 100000
set-option -g escape-time 10
set-option -g repeat-time 500
set-option -g focus-events on
set-option -g set-clipboard on
set-option -g base-index 0
set-window-option -g pane-base-index 0
set-option -g renumber-windows off
set-window-option -g mode-keys emacs
set-window-option -g automatic-rename on
set-window-option -g aggressive-resize on
set-option -g display-time 1500

# Нижняя строка в духе screen. Красный SYNC виден при синхронном вводе.
set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 2
set-option -g status-left-length 40
set-option -g status-right-length 80
set-option -g status-left '#[bold][#S]#[default] '
set-window-option -g window-status-format '#I:$W'
set-window-option -g window-status-current-format '#[reverse]#I:$W*#[default]'
set-option -g window-status-separator ' '
set-option -g status-right '#{?pane_synchronized,#[bg=red] SYNC #[default],} %H:%M %d-%m-%Y'
